allowed_domains:
  - "127.0.0.1:5000"
  - "localhost:5000"
  - "127.0.0.1:5001"
  - "localhost:5001"
allowed_actions:
  - navigate
  - click
  - type
  - read
  - press
  - assert
risky_actions_require_approval: true
# Actions that mutate state on the target system; discovery marks these risky.
risky_action_kinds:
  - click_submit_open
  - click_submit_transfer
# Notification sinks — all opt-in. Bell is on by default (free), webhook/slack
# only fire if their URL is set.
notify_bell: true
notify_webhook_url: null
notify_slack_webhook_url: null
