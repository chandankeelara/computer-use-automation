{% extends "_base.html" %}
{% block content %}
<table class="cls_frm">
  <tr><td colspan="2"><b>Member Lookup</b></td></tr>
  <form method="post" action="/search">
  <tr>
    <td>Member ID</td>
    <td><input type="text" name="q" size="20"></td>
  </tr>
  <tr>
    <td></td>
    <td><input type="submit" class="cls_btn" value="Search"></td>
  </tr>
  </form>
  {% if error %}
  <tr><td colspan="2" class="cls_err">{{ error }}</td></tr>
  {% endif %}
</table>
{% endblock %}
