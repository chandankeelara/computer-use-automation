<!doctype html>
<html>
<head>
<title>ACME Bancorp — Servicing Portal</title>
<style>
body{font-family:'Segoe UI',sans-serif;margin:0;background:#fafafa}
header{background:#111;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px}
header .logo{font-weight:700;letter-spacing:.4px}
header nav{margin-left:auto;color:#aaa;font-size:12px}
main{max-width:640px;margin:32px auto;background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:24px 28px}
h1{margin-top:0;font-size:20px}
label{display:block;font-size:12px;color:#555;margin-top:12px}
input[type=text]{width:100%;padding:8px 10px;font-size:14px;border:1px solid #bbb;border-radius:4px;box-sizing:border-box}
button{margin-top:16px;padding:8px 16px;font-size:14px;background:#1a5fb4;color:#fff;border:none;border-radius:4px;cursor:pointer}
button.secondary{background:#eee;color:#111}
.err{background:#fff2f2;color:#a00;border:1px solid #f4c;border-radius:4px;padding:8px 10px;margin-top:12px;font-size:13px}
.wizard-steps{display:flex;gap:12px;margin-bottom:16px;font-size:12px;color:#666}
.wizard-steps span{padding:2px 10px;border-radius:12px;background:#eee}
.wizard-steps span.on{background:#1a5fb4;color:#fff}
dl{display:grid;grid-template-columns:180px 1fr;gap:6px 12px;margin:12px 0}
dt{color:#666;font-size:12px}
dd{margin:0}
</style>
</head>
<body>
<header>
  <span class="logo">ACME Bancorp</span>
  <nav>Servicing Portal · v6.4</nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
